# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# Import this repository on Read the Docs. This file selects the Sphinx
# configuration and installs the package so autodoc can import pysmarthq.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
